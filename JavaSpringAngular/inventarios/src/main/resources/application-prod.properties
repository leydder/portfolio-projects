# Configuracion MySQL para produccion
# Activar con: --spring.profiles.active=prod
spring.datasource.url=jdbc:mysql://localhost:3306/inventarios_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=tu_password_aqui

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Deshabilitar consola H2 en produccion
spring.h2.console.enabled=false