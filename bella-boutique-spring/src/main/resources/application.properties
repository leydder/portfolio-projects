spring.application.name=bella-boutique

# SQLite datasource
spring.datasource.url=jdbc:sqlite:bella_boutique.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=bella-boutique-secret-key-2024-super-secure-256bits-key!!
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:8080

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
